<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Khata</title>
<meta name="description" content="Speak your udhaar. Voice-first ledger for kirana stores.">
<meta name="theme-color" content="#F5F5F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem('vk_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="desk">
  <section class="story" id="story" aria-label="About"></section>
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <div class="p-notch" id="island"><span class="idot"></span><span id="islandTxt">Voice Khata</span></div>
      <div class="p-status"><span id="clock">9:41</span><span class="p-icons"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.5" y="5" width="3" height="6" rx=".8"/><rect x="9" y="2.5" width="3" height="8.5" rx=".8"/><rect x="13.5" y="0" width="3" height="11" rx=".8"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3.2"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round"/></svg></span></div>
      <div class="p-screen">
        <div id="app">

          <!-- Onboarding -->
          <section id="onboard" class="screen" hidden></section>

          <!-- Sign up / unlock -->
          <section id="auth" class="screen auth" hidden>
            <div class="auth-card">
              <div class="logo"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
              <h1 id="authTitle">Voice Khata</h1>
              <p id="authSub" class="muted"></p>
              <div id="langChips" class="chips"></div>
              <form id="authForm" autocomplete="off">
                <div id="signupFields">
                  <label><span id="lblName"></span><input id="fName" required maxlength="40" autocomplete="off"></label>
                  <label><span id="lblShop"></span><input id="fShop" required maxlength="50" autocomplete="off"></label>
                </div>
                <label><span id="lblPin"></span><input id="fPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required autocomplete="off"></label>
                <label class="check" id="demoRow"><input id="fDemo" type="checkbox" checked><span id="lblDemo"></span></label>
                <button id="authBtn" class="btn primary" type="submit"></button>
                <p id="authErr" class="err" role="alert"></p>
              </form>
              <p id="authFoot" class="tiny muted"></p>
              <button id="resetBtn" class="link tiny" hidden></button>
            </div>
          </section>

          <!-- Main -->
          <main id="main" hidden>
            <header class="top">
              <div><p class="eyebrow">VOICE KHATA</p><h1 id="shopName"></h1></div>
              <div class="top-actions">
                <button id="langBtn" class="pill" aria-label="Language"></button>
                <button id="menuBtn" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
              </div>
            </header>

            <div id="views">
              <section id="v-home" class="view"></section>
              <section id="v-khata" class="view" hidden></section>
              <section id="v-stock" class="view" hidden></section>
              <section id="v-log" class="view" hidden></section>
            </div>

            <div id="dock" data-state="idle">
              <div id="voicePanel" class="vpanel" hidden>
              <div id="coach" class="coach" hidden></div>
              <div class="stage" aria-live="polite">
                <canvas id="viz" class="viz" width="440" height="440"></canvas>
                <p id="heard" class="heard"></p>
                <p id="said" class="said"></p>
                <div id="cards" class="cards"></div>
                <span id="chip" class="chip" hidden></span>
              </div>
              <div id="suggest" class="suggest"></div>
              <form id="typeRow" class="typerow" hidden><input id="typeIn" autocomplete="off"><button class="btn small primary">↵</button></form>
              <div class="orbrow">
                <button id="kbBtn" class="icon ghost" aria-label="Type instead"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
                <button id="orb" class="orb" aria-label="Tap to speak">
                  <span class="ring r1"></span><span class="ring r2"></span><span class="arc"></span>
                  <svg class="mic" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
                  <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
                </button>
                <button id="eodBtn" class="icon ghost" aria-label="Day summary"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
              </div>
              <p id="hint" class="hint"></p>
              </div>
              <nav class="tabs" id="tabs"></nav>
            </div>
          </main>

          <div id="sheetWrap" class="sheetwrap" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog"></div></div>
          <div id="toast" class="toast" hidden></div>
        </div>
      </div>
      <div class="p-bar"></div>
    </div>
  </div>

  <aside id="insight" class="insight" aria-label="Behind the scenes"></aside>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
